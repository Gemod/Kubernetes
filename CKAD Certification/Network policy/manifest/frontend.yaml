apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-demo
  template:
    metadata:
      labels:
        app: frontend-demo
    spec:
      containers:
        - name: frontend-demo
          image: gemod/test-nt-fe:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend-demo
  ports:
    - port: 80
      targetPort: 80
