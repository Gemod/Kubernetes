apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fullstack-demo-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: fullstack.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-go-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
