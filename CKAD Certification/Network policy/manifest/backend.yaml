apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-go
  template:
    metadata:
      labels:
        app: backend-go
    spec:
      containers:
        - name: backend-go
          image: gemod/test-nt-be:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: mydb
            - name: DB_USER
              value: myuser
            - name: DB_PASSWORD
              value: mypassword
---
apiVersion: v1
kind: Service
metadata:
  name: backend-go-service
spec:
  selector:
    app: backend-go
  ports:
    - port: 8080
      targetPort: 8080
